[build-system]
requires=["setuptools>=61.0"]
build-backend="setuptools.build_meta"
[project]
name="promptmeter"
version="0.1.0"
description="Token and cost estimator for LLM prompts"
readme="README.md"
requires-python=">=3.10"
dependencies=["click>=8.1.0","rich>=13.0.0"]
[project.scripts]
promptmeter="promptmeter.cli:main"
[tool.setuptools.packages.find]
where=["src"]
